# HTTPS gateway: public Nhost Auth + Hasura GraphQL, upstreams remain loopback-only.
server {
    listen 80;
    listen [::]:80;
    server_name api.888intelligence.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.888intelligence.org;

    ssl_certificate /etc/letsencrypt/live/api.888intelligence.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.888intelligence.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2m;

    # Only the token exchange is public. The Hasura auth hook remains on the
    # private Docker network and is never routed through this virtual host.
    location = /broker/v1/token {
        if ($nhost_auth_origin_allowed = 0) {
            return 403;
        }

        add_header Access-Control-Allow-Origin "https://vsrsms.in" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header Vary "Origin" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
        if ($request_method != POST) {
            return 405;
        }

        proxy_pass http://127.0.0.1:8091/v1/token;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 5s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8082/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /v1/graphql {
        if ($nhost_auth_origin_allowed = 0) {
            return 403;
        }

        proxy_pass http://127.0.0.1:8082/v1/graphql;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ^~ /v1/ {
        if ($nhost_auth_origin_allowed = 0) {
            return 403;
        }

        # Auth currently reflects arbitrary Origin values; replace its CORS headers
        # with the single canonical webview origin before returning to browsers.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Expose-Headers;
        add_header Access-Control-Allow-Origin "https://vsrsms.in" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Vary "Origin" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        return 404;
    }
}

