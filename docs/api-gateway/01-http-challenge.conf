# Temporary HTTP vhost for issuing the api.888intelligence.org certificate.
server {
    listen 80;
    listen [::]:80;
    server_name api.888intelligence.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 404;
    }
}
