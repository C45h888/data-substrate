services:
  minio:
    image: nhost/minio:RELEASE.2025-02-28T09-55-16Z
    restart: unless-stopped
    entrypoint: ["/bin/sh"]
    command:
      - -c
      - >-
        test -f /data/.nhost-volume-b199824b54f7a383 || { echo "Dedicated Nhost storage volume is not mounted" >&2; exit 1; };
        mkdir -p /data/objects;
        exec /usr/bin/minio server --address :9000 /data/objects
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:?Set STORAGE_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:?Set STORAGE_SECRET_KEY in .env}
    volumes:
      - type: bind
        source: /srv/nhost-storage
        target: /data
        bind:
          create_host_path: false
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - nhost-kamesh-net
    profiles:
      - storage
  storage:
    image: nhost/storage:0.7.2
    restart: unless-stopped
    command: ["serve"]
    ports:
      - "127.0.0.1:5000:5000"
      - "${WG_SERVER_ADDRESS:?Set WG_SERVER_ADDRESS in .env}:5000:5000"
    environment:
      BIND: ":5000"
      HASURA_ENDPOINT: http://graphql:8080/v1
      HASURA_GRAPHQL_ADMIN_SECRET: ${GRAPHQL_ADMIN_SECRET}
      POSTGRES_MIGRATIONS: "1"
      POSTGRES_MIGRATIONS_SOURCE: postgres://${HASURA_ADMIN_USER}:${HASURA_ADMIN_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      HASURA_METADATA: "1"
      PUBLIC_URL: http://${WG_SERVER_ADDRESS:?Set WG_SERVER_ADDRESS in .env}:5000
      S3_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?Set STORAGE_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${STORAGE_SECRET_KEY:?Set STORAGE_SECRET_KEY in .env}
      S3_BUCKET: nhost
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ""
      S3_ROOT_FOLDER: ""
    mem_limit: 128m
    cpus: 0.5
    depends_on:
      postgres:
        condition: service_healthy
      graphql:
        condition: service_healthy
      minio:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - nhost-kamesh-net
    profiles:
      - storage
